<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>DOOM</title>
  <meta name="theme-color" content="#000000" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game > *,
    #game canvas,
    #game .js-dos,
    #game .js-dos-canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      color: #9cff93;
      background: #000;
      font: 12px/1.4 monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="loading" id="loading">Carregando DOOM...</div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <script>
    window.addEventListener("load", async () => {
      try {
        const ci = await Dos(document.getElementById("game"), {
          url: "./assets/doom/doom.jsdos",
          kiosk: true,
          renderAspect: "4/3",
          imageRendering: "pixelated",
        });

        console.log("js-dos carregado:", ci);
        document.getElementById("loading").style.display = "none";
      } catch (err) {
        console.error("Erro ao iniciar DOOM:", err);
        document.getElementById("loading").textContent = "Erro ao carregar o jogo";
      }
    });
  </script>
</body>
</html>
